<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 - Page Recycled | EcoRefill</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Tailwind CSS + Fonts + Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .heading-font { font-family: 'Poppins', sans-serif; }
    body { background: #F1FAEE; overflow: hidden; }
    
    .btn-gradient { background: linear-gradient(135deg, #2D6A4F 0%, #40916C 100%); transition: all 0.3s; box-shadow: 0 8px 20px rgba(45,106,79,0.2); }
    .btn-gradient:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(45,106,79,0.3); }
    
    .floating-truck { animation: floatTruck 4s infinite ease-in-out; }
    @keyframes floatTruck { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(-2deg); } }
    
    .circle-bg { position: absolute; border-radius: 50%; background: #D8F3DC; z-index: 0; opacity: 0.6; }

    /* Dark Mode Overrides */
    .dark body { background: #081C15 !important; color: #e5e5e5 !important; }
    .dark h1, .dark h2, .dark h3, .dark p { color: #ffffff !important; }
    .dark .circle-bg { background: #1a2a24 !important; opacity: 0.3; }
    .dark .text-\[\#1B4332\] { color: #ffffff !important; }
    .dark .bg-white { background-color: #0d1712 !important; }
    .dark .border-\[\#D8F3DC\] { border-color: rgba(149, 213, 178, 0.3) !important; }
    .dark .text-gray-500 { color: #a1a1aa !important; }
    
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

    <!-- Abstract Background -->
    <div class="circle-bg w-[500px] h-[500px] -top-20 -left-20"></div>
    <div class="circle-bg w-[300px] h-[300px] bottom-10 right-10"></div>
    <div class="circle-bg w-[150px] h-[150px] top-1/4 right-1/4"></div>

    <div class="text-center relative z-10 max-w-2xl">
      <div class="mb-8 floating-truck inline-block">
        <div class="w-48 h-48 bg-white rounded-full flex items-center justify-center shadow-2xl relative">
          <i class="fas fa-truck text-7xl text-[#2D6A4F]"></i>
          <div class="absolute -top-4 -right-4 w-16 h-16 bg-[#95D5B2] rounded-full flex items-center justify-center text-white text-2xl shadow-lg">
             <i class="fas fa-question"></i>
          </div>
        </div>
      </div>
      
      <h1 class="text-9xl font-black text-[#1B4332] leading-none mb-4">404</h1>
      <h2 class="text-3xl md:text-4xl font-bold text-[#2D6A4F] mb-6">Oops! This page was recycled.</h2>
      <p class="text-gray-600 text-lg mb-12 max-w-md mx-auto">The resource you're looking for has either moved to a more sustainable location or never existed in the first place.</p>
      
      <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <a href="Index.html" class="btn-gradient text-white px-10 py-4 rounded-full font-bold shadow-xl flex items-center justify-center gap-2">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="Products.html" class="bg-white border-2 border-[#2D6A4F] text-[#2D6A4F] px-10 py-4 rounded-full font-bold hover:bg-[#D8F3DC] transition flex items-center justify-center gap-2">
          <i class="fas fa-search"></i> Search Products
        </a>
      </div>
      
      <div class="mt-16 pt-16 border-t border-[#D8F3DC]">
        <p class="text-sm text-gray-400 font-medium tracking-widest uppercase">Lost? Try these instead:</p>
        <div class="flex flex-wrap justify-center gap-6 mt-6">
          <a href="Locations.html" class="text-gray-500 hover:text-[#2D6A4F] font-bold transition">Truck Tracker</a>
          <a href="Sustainability.html" class="text-gray-500 hover:text-[#2D6A4F] font-bold transition">Our Impact</a>
          <a href="Blog.html" class="text-gray-500 hover:text-[#2D6A4F] font-bold transition">Eco Blog</a>
          <a href="Contact.html" class="text-gray-500 hover:text-[#2D6A4F] font-bold transition">Get Help</a>
        </div>
      </div>
    </div>

    <script>
        // No explicit buttons in 404 but keeping consistency if accessed via keyboard/global states
        let dark = false;
        window.addEventListener('keydown', (e) => {
           if(e.key === 'd') { dark = !dark; document.documentElement.classList.toggle('dark'); }
        });
    </script>
</body>
</html>
